<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Maria Yurko" />
  <meta name="theme-color" content="#EAEFF0" />
  <title>Maria Yurko</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <form
      id="capture"
      class="capture"
      data-state="idle"
      method="post"
      action="https://df3e60-5.myshopify.com/contact#newsletter"
      accept-charset="UTF-8"
      novalidate
    >
      <input type="hidden" name="form_type" value="customer" />
      <input type="hidden" name="utf8" value="✓" />
      <input type="hidden" name="contact[tags]" value="newsletter" />
      <label for="email" class="visually-hidden">Email address</label>
      <input
        type="email"
        id="email"
        name="contact[email]"
        class="email-input"
        placeholder="Enter your email address"
        autocomplete="email"
        autocapitalize="off"
        spellcheck="false"
        inputmode="email"
        required
      />
      <button type="submit" class="submit-btn" aria-label="Submit email">
        <svg class="icon-arrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
        <svg class="icon-check" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12l5 5L20 7"/>
        </svg>
      </button>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
